doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'

        # WAMP utilise MyISAM par défaut, qui ignore les clés étrangères :
        # on force InnoDB pour toutes les tables créées par Doctrine.
        default_table_options:
            engine: InnoDB
            charset: utf8mb4
            collation: utf8mb4_unicode_ci
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        dbal:
            # Connexion chiffrée à MySQL (Aiven exige SSL) : le certificat de l'autorité
            # est écrit dans /tmp/mysql-ca.pem par docker/entrypoint.sh
            options:
                !php/const Pdo\Mysql::ATTR_SSL_CA: '%env(MYSQL_SSL_CA_PATH)%'
                !php/const Pdo\Mysql::ATTR_SSL_VERIFY_SERVER_CERT: '%env(bool:MYSQL_SSL_VERIFY)%'
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
