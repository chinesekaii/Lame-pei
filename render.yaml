# Déploiement sur Render (Blueprint) — guide complet : docs/DEPLOIEMENT.md
# Les valeurs « sync: false » sont demandées par Render à la création et ne sont jamais écrites ici.
services:
  - type: web
    name: lame-pei
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: prod
      - key: APP_SECRET
        generateValue: true
      # Base TiDB Cloud (compatible MySQL), ex.
      # mysql://xxxx.root:MOT_DE_PASSE@gateway01.eu-central-1.prod.aws.tidbcloud.com:4000/lame_pei?serverVersion=8.0.11&charset=utf8mb4
      - key: DATABASE_URL
        sync: false
      - key: MYSQL_SSL_VERIFY
        value: "1"
      # Render reçoit le HTTPS et transmet la requête : on fait confiance à son proxy
      - key: TRUSTED_PROXIES
        value: REMOTE_ADDR
      # Adresse publique du site, ex. https://lame-pei.onrender.com
      - key: DEFAULT_URI
        sync: false
      # Compte administrateur créé au premier démarrage (mot de passe : 12 caractères minimum)
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Pas d'envoi d'e-mails pour la démo (ils sont simplement ignorés)
      - key: MAILER_DSN
        value: null://null
