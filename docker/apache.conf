# Hôte Apache du site (le port est remplacé au démarrage par entrypoint.sh)
<VirtualHost *:10000>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride None
        Require all granted
        # Toutes les adresses qui ne sont pas des fichiers passent par Symfony
        FallbackResource /index.php
    </Directory>

    # Les fichiers compilés par AssetMapper ont un nom versionné : mise en cache longue
    <Directory /var/www/html/public/assets>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "SAMEORIGIN"

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>

ServerName localhost
ServerTokens Prod
ServerSignature Off
