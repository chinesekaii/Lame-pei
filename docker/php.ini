; Réglages PHP de production
memory_limit = 256M
expose_php = Off
date.timezone = UTC

; Photos envoyées depuis l'admin (téléphones : plusieurs Mo)
upload_max_filesize = 12M
post_max_size = 14M

; Cache d'opcodes : le code ne change pas tant que l'image n'est pas reconstruite
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Cookies de session : réglés par Symfony (sécurisés automatiquement en https)
